<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agriculture Schemes - WBseva AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ----- Hero Section ----- */
    .category-hero {
      padding: 120px 0 50px;
      text-align: center;
      background: var(--bg-section);
      border-bottom: 1px solid var(--border-color);
    }
    .category-badge {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      padding: 6px 20px;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 12px;
    }
    .category-hero h1 {
      font-size: 2.6rem;
      font-weight: 800;
    }
    .category-hero p {
      color: var(--text-gray);
      max-width: 600px;
      margin: 10px auto 20px;
    }
    .category-stats {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      color: var(--text-gray);
    }
    .category-stats i {
      color: #10b981;
    }

    /* ----- Schemes Grid ----- */
    .schemes-grid-section {
      padding: 50px 0;
    }
    .schemes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    /* ----- Scheme Card ----- */
    .scheme-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 24px;
      transition: 0.3s ease;
      cursor: pointer;
    }
    .scheme-card:hover {
      transform: translateY(-6px);
      border-color: #10b981;
      box-shadow: 0 20px 40px rgba(16, 185, 129, 0.15);
    }
    .scheme-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .scheme-card-header h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-white);
      flex: 1;
    }
    .scheme-card-amount {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      padding: 4px 14px;
      border-radius: 50px;
      font-size: 0.75rem;
      white-space: nowrap;
    }
    .scheme-card p {
      color: var(--text-gray);
      font-size: 0.85rem;
      line-height: 1.5;
      margin: 10px 0 12px;
    }
    .scheme-card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .scheme-card-tags span {
      background: rgba(255,255,255,0.04);
      color: var(--text-gray);
      padding: 2px 12px;
      border-radius: 50px;
      font-size: 0.65rem;
    }
    .scheme-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .scheme-eligibility {
      font-size: 0.7rem;
      color: var(--text-gray);
    }
    .view-detail-btn {
      background: linear-gradient(135deg, #10b981, #34d399);
      border: none;
      color: #fff;
      padding: 8px 22px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.3s ease;
    }
    .view-detail-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
    }

    /* ----- Modal ----- */
    .scheme-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .scheme-modal-content {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 40px;
      position: relative;
      animation: fadeUp 0.3s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-color);
      color: var(--text-gray);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.3rem;
      cursor: pointer;
    }
    .modal-close:hover {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }
    .modal-scheme-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-white);
      padding-right: 40px;
      margin-bottom: 10px;
    }
    .modal-scheme-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
      color: var(--text-gray);
      font-size: 0.9rem;
    }
    .modal-amount {
      color: #10b981;
      font-weight: 700;
    }
    .modal-section {
      margin-bottom: 20px;
    }
    .modal-section h4 {
      color: var(--text-white);
      margin-bottom: 6px;
    }
    .modal-section p {
      color: var(--text-gray);
      line-height: 1.6;
    }
    .modal-section ul {
      list-style: none;
      padding: 0;
    }
    .modal-section ul li {
      padding: 6px 0;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-gray);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .modal-section ul li::before {
      content: "✓";
      color: #10b981;
      font-weight: 700;
    }
    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }
    .modal-apply-btn {
      background: linear-gradient(135deg, #10b981, #34d399);
      color: #fff;
      padding: 12px 30px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .modal-apply-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.35);
    }
    .modal-save-btn,
    .modal-share-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-color);
      color: var(--text-gray);
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.3s ease;
    }
    .modal-save-btn:hover {
      border-color: #10b981;
      color: #10b981;
    }
    .modal-share-btn:hover {
      border-color: #3b82f6;
      color: #3b82f6;
    }

    .back-to-categories {
      text-align: center;
      margin-top: 40px;
    }
    .back-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border-color);
      color: var(--text-white);
      padding: 12px 32px;
      border-radius: 50px;
      display: inline-block;
      text-decoration: none;
    }
    .back-btn:hover {
      background: rgba(255,255,255,0.12);
    }
    .no-schemes {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-gray);
      grid-column: 1 / -1;
    }
    .no-schemes i {
      font-size: 3rem;
      color: #ef4444;
      display: block;
      margin-bottom: 16px;
    }
    @media (max-width: 600px) {
      .category-hero h1 { font-size: 1.8rem; }
      .schemes-grid { grid-template-columns: 1fr; }
      .scheme-modal-content { padding: 24px; }
    }
  </style>
</head>

  // ==========================================
  // 2. RENDER SCHEMES
  // ==========================================
  function renderSchemes() {
    const grid = document.getElementById("schemesGrid");
    if (!grid) return;

    // Update scheme count
    document.getElementById("schemeCount").innerText = agricultureData.length;

    if (agricultureData.length === 0) {
      grid.innerHTML = `
        <div class="no-schemes">
          <i class="fas fa-tractor"></i>
          <h3>No Agriculture Schemes Found</h3>
          <p>Please check back later.</p>
        </div>
      `;
      return;
    }

    grid.innerHTML = agricultureData.map((s, i) => `
      <div class="scheme-card">
        <div class="scheme-card-header">
          <h3>${s.title}</h3>
          <span class="scheme-card-amount">${s.amount}</span>
        </div>
        <p>${s.description.substring(0, 120)}${s.description.length > 120 ? '...' : ''}</p>
        <div class="scheme-card-tags">
          ${s.tags.slice(0, 3).map(t => `<span>#${t}</span>`).join('')}
        </div>
        <div class="scheme-card-footer">
          <span class="scheme-eligibility">👤 ${s.eligibility.substring(0, 50)}${s.eligibility.length > 50 ? '...' : ''}</span>
          <button class="view-detail-btn" onclick="openModal('${s.id}')">View Details →</button>
        </div>
      </div>
    `).join('');
  }

  // ==========================================
  // 3. OPEN / CLOSE MODAL
  // ==========================================
  function openModal(id) {
    const scheme = agricultureData.find(s => s.id === id);
    if (!scheme) return;

    const modal = document.getElementById("schemeModal");
    const body = document.getElementById("modalBody");

    body.innerHTML = `
      <h2 class="modal-scheme-title">${scheme.title}</h2>
      <div class="modal-scheme-meta">
        <span>📂 ${scheme.category}</span>
        <span class="modal-amount">💰 ${scheme.amount}</span>
        <span>📍 ${scheme.state}</span>
        <span>🏷️ ${scheme.level}</span>
      </div>

      <div class="modal-section">
        <h4>📋 Description</h4>
        <p>${scheme.description}</p>
      </div>

      <div class="modal-section">
        <h4>✅ Eligibility</h4>
        <p>${scheme.eligibility}</p>
      </div>

      <div class="modal-section">
        <h4>🎯 Benefits</h4>
        <ul>${scheme.benefits.map(b => `<li>${b}</li>`).join('')}</ul>
      </div>

      <div class="modal-section">
        <h4>📄 Documents Required</h4>
        <ul>${scheme.documents.map(d => `<li>${d}</li>`).join('')}</ul>
      </div>

      <div class="modal-actions">
        <a href="${scheme.applyLink}" target="_blank" class="modal-apply-btn">
          <i class="fas fa-external-link-alt"></i> Apply Now
        </a>
        <button class="modal-save-btn" onclick="saveScheme('${scheme.id}')">
          <i class="fas fa-bookmark"></i> Save
        </button>
        <button class="modal-share-btn" onclick="shareScheme('${scheme.id}')">
          <i class="fas fa-share-alt"></i> Share
        </button>
      </div>
    `;

    modal.style.display = "flex";
    document.body.style.overflow = "hidden";
  }

  function closeModal() {
    document.getElementById("schemeModal").style.display = "none";
    document.body.style.overflow = "auto";
  }

  // Click outside modal to close
  document.getElementById("schemeModal").addEventListener("click", function (e) {
    if (e.target === this) closeModal();
  });

  // ESC key to close
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeModal();
  });

  // ==========================================
  // 4. SAVE & SHARE
  // ==========================================
  function saveScheme(id) {
    const scheme = agricultureData.find(s => s.id === id);
    if (!scheme) return;
    const saved = JSON.parse(localStorage.getItem("savedSchemes") || "[]");
    if (!saved.includes(id)) {
      saved.push(id);
      localStorage.setItem("savedSchemes", JSON.stringify(saved));
      alert(`✅ "${scheme.title}" saved!`);
    } else {
      alert(`⚠️ "${scheme.title}" already saved.`);
    }
  }

  function shareScheme(id) {
    const scheme = agricultureData.find(s => s.id === id);
    if (!scheme) return;
    const text = `🌾 ${scheme.title}\n💰 ${scheme.amount}\n✅ ${scheme.eligibility}\n🔗 ${scheme.applyLink}`;
    if (navigator.share) {
      navigator.share({ title: scheme.title, text, url: scheme.applyLink }).catch(() => {});
    } else {
      navigator.clipboard.writeText(text).then(() => alert("✅ Copied to clipboard!"));
    }
  }

  // ==========================================
  // 5. RUN ON PAGE LOAD
  // ==========================================
  document.addEventListener("DOMContentLoaded", function () {
    renderSchemes();
    console.log("✅ Agriculture page loaded with", agricultureData.length, "schemes");
  });
</script>
